name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (library and showcase, on the JVM)
        run: ./gradlew :sancai:testDebugUnitTest :showcase:testDebugUnitTest

      - name: Build the library and the demo app
        run: ./gradlew :sancai:assembleRelease :showcase:assembleDebug

      - name: Upload snapshot pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: |
            sancai/build/snapshots
            showcase/build/snapshots
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            sancai/build/reports/tests
            showcase/build/reports/tests

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: |
            sancai/build/outputs/aar/*.aar
            showcase/build/outputs/apk/debug/*.apk
